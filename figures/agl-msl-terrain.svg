<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1080" viewBox="0 0 480 1080" role="img" aria-labelledby="title desc">
  <title id="title">One MSL altitude, two AGL heights</title>
  <desc id="desc">Original teaching diagram with hypothetical elevations. A drone at 1100 feet MSL is 200 feet AGL over ground at 900 feet MSL at location A. At the same 1100 feet MSL, it is 100 feet AGL over ground at 1000 feet MSL at location B. Use the ground elevation at each location. This is not a navigation chart and is not to scale.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#172d39}
    .title{font-size:29px;font-weight:700}
    .label{font-size:25px;font-weight:700}
    .body{font-size:24px}
    .note{font-size:22px;fill:#536572}
    .green{fill:#287064}
    .blue{fill:#316da5}
  </style>
  <rect width="480" height="1080" rx="18" fill="#f7f8f1"/>
  <text x="24" y="44" class="title">Same MSL, different AGL</text>
  <text x="24" y="78" class="note">Original example · not to scale</text>
  <rect x="24" y="100" width="432" height="74" rx="12" fill="#e8eee9"/>
  <text x="40" y="129" class="label">AGL = MSL − local ground</text>
  <text x="40" y="159" class="note">Use feet. Check AGL or MSL.</text>

  <text x="24" y="215" class="label blue">Drone altitude: 1,100 ft MSL</text>
  <line x1="32" y1="240" x2="448" y2="240" stroke="#316da5" stroke-width="3" stroke-dasharray="8 6"/>
  <g fill="none" stroke="#287064" stroke-width="4" stroke-linecap="round">
    <path d="M92 240H142M117 232V248M101 233V247M133 233V247"/>
    <path d="M325 240H375M350 232V248M334 233V247M366 233V247"/>
  </g>
  <path d="M32 390H216L310 315H448V470H32Z" fill="#e3d9c4"/>
  <path d="M32 390H216L310 315H448" fill="none" stroke="#72523f" stroke-width="4"/>
  <g fill="none" stroke="#287064" stroke-width="3">
    <path d="M183 244V386M176 257L183 244L190 257M176 373L183 386L190 373"/>
    <path d="M418 244V311M411 257L418 244L425 257M411 298L418 311L425 298"/>
  </g>
  <text x="40" y="292" class="label green">200 ft</text>
  <text x="40" y="322" class="label green">AGL</text>
  <text x="294" y="276" class="label green">100 ft</text>
  <text x="294" y="304" class="label green">AGL</text>
  <text x="40" y="426" class="label">Ground A</text>
  <text x="40" y="456" class="body">900 ft MSL</text>
  <text x="276" y="426" class="label">Ground B</text>
  <text x="276" y="456" class="body">1,000 ft MSL</text>

  <line x1="32" y1="515" x2="448" y2="515" stroke="#316da5" stroke-width="3"/>
  <text x="32" y="549" class="label blue">Mean sea level: 0 ft MSL</text>
  <rect x="24" y="580" width="432" height="126" rx="12" fill="#e8eee9"/>
  <text x="42" y="616" class="label">Location A</text>
  <text x="42" y="653" class="body">1,100 − 900 = 200 ft AGL</text>
  <text x="42" y="686" class="note">900 + 200 = 1,100 ft MSL</text>
  <rect x="24" y="726" width="432" height="126" rx="12" fill="#e8eee9"/>
  <text x="42" y="762" class="label">Location B</text>
  <text x="42" y="799" class="body">1,100 − 1,000 = 100 ft AGL</text>
  <text x="42" y="832" class="note">1,000 + 100 = 1,100 ft MSL</text>
  <text x="24" y="894" class="label">Higher ground → less AGL</text>
  <text x="24" y="932" class="body">Use the ground at each location.</text>
  <text x="24" y="966" class="body">Keep units and location consistent.</text>
  <text x="24" y="1016" class="note">Reference: FAA AIM glossary, Altitude.</text>
  <text x="24" y="1048" class="note">Hypothetical terrain · not for navigation</text>
</svg>
